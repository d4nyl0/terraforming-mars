services:
  terraforming-mars:
    container_name: terraforming-mars
    build: ./
    restart: unless-stopped
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    volumes:
      - tm-db:/usr/src/app/db
    command: ["sh", "-c", "chown -R tfm:nogroup /usr/src/app/db && npm run start"]
    user: "0"

volumes:
  tm-db:
